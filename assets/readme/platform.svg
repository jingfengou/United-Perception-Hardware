<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">UP platform: two paths, shared capabilities</title>
  <desc id="desc">UP models enter through the compatible up.accelerator facade. Explicit training and inference factories reuse base device backends and operators grouped by category then vendor. Evaluation inside training stays on the training path.</desc>
  <rect width="1200" height="620" rx="8" fill="#ffffff"/>
  <g fill="none" stroke="#0f766e" stroke-width="3">
    <path d="M600 140V180H310V220M600 180H890V220"/>
    <path d="M310 330V370H890V330M600 370V410"/>
    <path d="M600 490V530"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle" fill="#18181b">
    <g id="up-entry">
      <text x="600" y="75" font-size="60" font-weight="650">UP</text>
      <text x="600" y="122" font-size="32" fill="#71717a">models / runner / APIs</text>
    </g>
    <g id="explicit-purposes">
      <rect x="80" y="220" width="460" height="110" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <rect x="660" y="220" width="460" height="110" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
      <text x="310" y="272" font-size="52" font-weight="600">Training</text>
      <text x="310" y="310" font-size="28" fill="#71717a">train + training eval</text>
      <text x="890" y="272" font-size="52" font-weight="600">Inference</text>
      <text x="890" y="310" font-size="28" fill="#71717a">predict + export</text>
    </g>
    <g id="shared-capabilities">
      <rect x="80" y="410" width="1040" height="80" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <text x="600" y="467" font-size="52" font-weight="600">Base + common operators</text>
    </g>
    <g id="selected-vendor">
      <text x="600" y="580" font-size="52" font-weight="600">Operator category / vendor</text>
    </g>
  </g>
</svg>
