name: Hardware boundaries
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest setuptools wheel packaging PyYAML numpy==1.26.4 scipy==1.15.3 onnx==1.17.0 pycocotools==2.0.10
      - run: python -m pip install --no-deps --no-build-isolation -e packages/up-platform
      - run: python tools/check_hardware_boundaries.py
      - run: python tools/export_accelerator_contract.py --check
      - run: python tools/export_platform_contract.py --check
      - run: python -m pytest -q packages/up-platform/tests
      - run: python -m pytest -q tests/test_accelerator.py tests/test_hardware_contract.py tests/test_training_accuracy.py tests/test_multiseed_accuracy.py tests/test_vendor_validation.py tests/test_cross_vendor_accuracy.py tests/test_portable_numerics.py tests/test_portable_evidence.py tests/test_platform_migration.py
      - run: UP_BUILD_BACKEND=none python -m pip wheel --no-deps --no-build-isolation .
      - run: UP_BUILD_BACKEND=none python -m pip wheel --no-deps --no-build-isolation packages/up-platform
