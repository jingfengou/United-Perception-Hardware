name: Hardware boundaries
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest setuptools wheel packaging
      - run: python tools/check_hardware_boundaries.py
      - run: python -m pytest -q tests/test_accelerator.py
      - run: UP_BUILD_BACKEND=none python -m pip wheel --no-deps --no-build-isolation .
