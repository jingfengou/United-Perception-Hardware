[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "up-platform"
version = "0.1.0"
description = "Independent hardware contracts and purpose-scoped backends for UP"
requires-python = ">=3.8"
dependencies = ["packaging>=20"]
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
up_platform = ["common/*.json", "backends/nvidia/csrc/**/*.cpp", "backends/nvidia/csrc/**/*.cu", "backends/nvidia/csrc/**/*.h", "backends/nvidia/csrc/**/*.hpp", "backends/nvidia/csrc/**/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
