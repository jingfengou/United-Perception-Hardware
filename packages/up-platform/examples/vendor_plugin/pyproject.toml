[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "up-platform-example-vendor"
version = "0.1.0"
description = "CPU-only vendor plugin demonstration, not a hardware implementation"
requires-python = ">=3.8"
dependencies = ["up-platform>=0.1.0,<0.2"]

[tool.setuptools.packages.find]
include = ["up_example_vendor*"]
